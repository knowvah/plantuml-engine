<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" style="width:640px;height:442px;background:#000000;" width="640px" height="442px" viewBox="0 0 640 442" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml $version$?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="5" y="17" fill="#33FF02" font-size="12" textLength="371.25" font-weight="700" font-style="italic">PlantUML version $version$ / $git.commit.id$ [Unknown compile time]</text><rect x="5" y="25" width="336.175" height="19" fill="#33FF02" style="stroke:#33FF02;stroke-width:1;"/><text x="6" y="40" fill="#000" font-size="14" textLength="147.613" font-weight="700">[From in.puml (line 26) ]</text><text x="5" y="58" fill="#33FF02" font-size="14" font-weight="700"> </text><text x="5" y="72" fill="#33FF02" font-size="14" textLength="63.963" font-weight="700">@startuml</text><text x="5" y="86" fill="#33FF02" font-size="14" textLength="138.512" font-weight="700">title Connecting nodes</text><text x="5" y="100" fill="#33FF02" font-size="14" font-weight="700"> </text><text x="5" y="114" fill="#33FF02" font-size="14" textLength="137.025" font-weight="700">participant Application</text><text x="5" y="128" fill="#33FF02" font-size="14" textLength="150.938" font-weight="700">participant GraphBuilder</text><text x="5" y="142" fill="#33FF02" font-size="14" textLength="107.275" font-weight="700">participant Graph</text><text x="5" y="156" fill="#33FF02" font-size="14" textLength="111.912" font-weight="700">participant "Pin A"</text><text x="5" y="170" fill="#33FF02" font-size="14" textLength="111.912" font-weight="700">participant "Pin B"</text><text x="5" y="184" fill="#33FF02" font-size="14" textLength="125.912" font-weight="700">participant "Node C"</text><text x="5" y="198" fill="#33FF02" font-size="14" textLength="138.25" font-weight="700">participant "Type of B"</text><text x="5" y="212" fill="#33FF02" font-size="14" font-w