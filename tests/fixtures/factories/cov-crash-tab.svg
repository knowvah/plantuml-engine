<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="BPM" style="width:349px;height:273px;background:#FFFFFF;" width="349px" height="273px" viewBox="0 0 349 273" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml $version$?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="10" y="20.889" fill="#000" font-size="14" textLength="94.15" font-weight="700">Crash Diagram</text><text x="10" y="34.889" fill="#000" font-size="14"> </text><text x="10" y="48.889" fill="#000" font-size="14" textLength="299.337">This diagram is only used to test crash handling.</text><text x="10" y="62.889" fill="#000" font-size="14"> </text><text x="10" y="76.889" fill="#000" font-size="14" textLength="191.012">There are three types of crash:</text><text x="17.7" y="90.889" fill="#000" font-size="14" textLength="50.05">• During</text><text x="71.6" y="90.889" fill="#000" font-size="14" textLength="45.938" font-weight="700">parsing</text><text x="17.7" y="104.889" fill="#000" font-size="14" textLength="50.05">• During</text><text x="71.6" y="104.889" fill="#000" font-size="14" textLength="54.6" font-weight="700">finalizing</text><text x="17.7" y="118.889" fill="#000" font-size="14" textLength="50.05">• During</text><text x="71.6" y="118.889" fill="#000" font-size="14" textLength="49.088" font-weight="700">drawing</text><text x="10" y="132.889" fill="#000" font-size="14"> </text><text x="10" y="146.889" fill="#000" font-size="14" textLength="328.65">The purpose is to verify that PlantUML error recovery</text><text x="10" y="160.889" fill="#000" font-size="14" textLength="320.337">mechanisms work correctly, using a diagram whose</text><text x="10" y="174.889" fill="#000" font-size="14" textLength="140.087">behavior is predictable</text><text x="153.938" y="174.889" fill="#000" font-size="14" textLength="69.125" font-style="italic">(it crashes)</text><text x="223.063" y="174.889" fill="#000" font-size="14">.</text><text x="10" y="188.889" fill="#000" font-size="14"> </text><text x="10" y="202.889" fill="#000" font-size="14" textLength="271.425">To do so, you should the following directive:</text><text x="17.7" y="216.889" fill="#000" font-size="14">•</text><text x="26.45" y="216.889" fill="#000" font-size="14" textLength="121.363" font-family="monospace">crash when parsing</text><text x="17.7" y="230.889" fill="#000" font-size="14">•</text><text x="26.45" y="230.889" fill="#000" font-size="14" textLength="130.025" font-family="monospace">crash when finalizing</text><text x="17.7" y="244.889" fill="#000" font-size="14">•</text><text x="26.45" y="244.889" fill="#000" font-size="14" textLength="124.512" font-family="monospace">crash when drawing</text><text x="10" y="258.889" fill="#000" font-size="14"> </text><?plantuml-src SoWkIImgIIvABCxW0fESvHcfUGefHOdbcNdfN0wfUIaGIIwLijIYuipyF1K0?></g></svg>